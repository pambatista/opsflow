services:
  postgres:
    image: postgres:16
    container_name: opsflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: opsflow
      POSTGRES_USER: opsflow
      POSTGRES_PASSWORD: opsflow
    ports:
      - "5432:5432"
    volumes:
      - opsflow_postgres_data:/var/lib/postgresql/data

volumes:
  opsflow_postgres_data:
